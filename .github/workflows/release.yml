name: Release Windows

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install version tooling
        run: python -m pip install --upgrade pip packaging

      - name: Calculate release version
        id: version
        run: |
          $version = python -m palworld_console.versioning --file palworld_console/VERSION --bump "${{ inputs.bump_type }}"
          if ($LASTEXITCODE -ne 0) { throw "Version increment failed" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Releasing v$version"

      - name: Install build dependencies
        run: |
          python -m pip install -e . pytest pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build application
        run: pyinstaller --noconfirm --clean palworld_console.spec

      - name: Verify packaged version
        run: |
          $actual = (& .\dist\PalworldConsole.exe --version | Out-String).Trim()
          if ($actual -ne "${{ steps.version.outputs.version }}") {
            throw "Packaged version $actual does not match ${{ steps.version.outputs.version }}"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and checksum
        id: assets
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $source = (Resolve-Path .\dist\PalworldConsole.exe).Path
          $output = (Resolve-Path .\release).Path
          & $compiler "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceExe=$source" "/DOutputDir=$output" .\installer\PalworldConsole.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $installer = Join-Path $output "PalworldConsole-Setup-v${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash *$(Split-Path -Leaf $installer)" | Set-Content -Path (Join-Path $output "SHA256SUMS.txt") -Encoding ascii
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksums=$(Join-Path $output 'SHA256SUMS.txt')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Authenticode signing can be inserted here before checksums are generated.
      - name: Commit version and create tag
        run: |
          $version = "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add palworld_console/VERSION
          git commit -m "chore: release v$version"
          git tag -a "v$version" -m "Release v$version"
          git push --atomic origin HEAD:main "v$version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" `
            "${{ steps.assets.outputs.installer }}" `
            "${{ steps.assets.outputs.checksums }}" `
            --title "v${{ steps.version.outputs.version }}" `
            --generate-notes `
            --verify-tag

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PalworldConsole-v${{ steps.version.outputs.version }}
          path: |
            release/PalworldConsole-Setup-v${{ steps.version.outputs.version }}.exe
            release/SHA256SUMS.txt
