[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palworld-console"
version = "0.3.0"
description = "Local and remote Palworld dedicated server console"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "keyring>=24.3",
  "requests>=2.31",
  "paramiko>=3.4",
  "palworld-save-tools==0.24.0",
]

[project.scripts]
palworld-console = "palworld_console.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
